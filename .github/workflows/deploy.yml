name: Deploy to Azure Container Instances

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: regflotacombustible.azurecr.io
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t regflotacombustible.azurecr.io/streamlit-app:latest .
        docker push regflotacombustible.azurecr.io/streamlit-app:latest

    - name: Deploy to Azure Container Instances
      uses: azure/aci-deploy@v1
      with:
        resource-group: 'prod-nuevo'       # Reemplaza por tu Grupo de Recursos en Azure
        image: regflotacombustible.azurecr.io/streamlit-app:latest
        registry-login-server: regflotacombustible.azurecr.io
        registry-username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        registry-password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
        name: 'contenedor-flota-v6'              # El nombre de tu instancia de contenedor actual
        location: 'East US'                    # La ubicación de tu recurso (ej: eastus, southcentralus)
        ports: 8501
        secure-environment-variables: |
          DB_USER_INDICADORES="srios"
          DB_PASS_INDICADORES="Sebastian2026"
          DB_USER_QAS="calidadsa"
          DB_PASS_QAS="Exalmar$2026"